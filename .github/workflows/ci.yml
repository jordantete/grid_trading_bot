name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      upload-coverage:
        description: "Upload the Python 3.12 coverage report to Codecov"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }} --all-extras --dev

      - name: Run tests and upload coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=grid_trading_bot --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12' && format('{0}', inputs.upload-coverage) != 'false'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --python 3.12 --all-extras --dev

      - name: ruff check
        run: uv run --python 3.12 ruff check .

      - name: ruff format
        run: uv run --python 3.12 ruff format --check .

      - name: mypy
        run: uv run --python 3.12 mypy
