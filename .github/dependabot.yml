version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Bumped by hand, together with the e2e snapshots they can shift
      - dependency-name: "numpy"
      - dependency-name: "pandas"
    labels:
      - "pip-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "actions"
