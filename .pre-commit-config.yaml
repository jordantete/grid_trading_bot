repos:
  # Run from the project environment so the hooks use the versions pinned in pyproject.toml, like CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linting)
        entry: uv run --frozen --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (formatting)
        entry: uv run --frozen --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # Built-in hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of files
      - id: check-yaml
        name: check yaml
      - id: check-json
        name: check json
      - id: check-toml
        name: check toml
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-added-large-files
        name: check for added large files
        args: ["--maxkb=1000"]
      - id: debug-statements
        name: debug statements (Python)

  # Python-specific checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
        name: check blanket noqa
      - id: python-check-blanket-type-ignore
        name: check blanket type ignore
      - id: python-no-log-warn
        name: check for deprecated log warn
      - id: python-use-type-annotations
        name: check use type annotations
      - id: text-unicode-replacement-char
        name: check for unicode replacement chars
