services:
  bot:
    build: .
    container_name: grid_trading_bot
    profiles: ["bot"]
    # on-failure: a halted bot exits 0 and stays down; a crash, a lost feed or a reboot relaunches it
    restart: on-failure
    # 20 s of tick drain, 10 s of poll drain, the cancellations and a 5 s checkpoint lock wait fit in a minute
    stop_grace_period: 60s
    command: ["run", "--config", "${BOT_CONFIG:-config/config.json}", "--no-plot"]
    environment:
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_SECRET_KEY=${EXCHANGE_SECRET_KEY:-}
      - EXCHANGE_PASSWORD=${EXCHANGE_PASSWORD:-}
      - APPRISE_NOTIFICATION_URLS=${APPRISE_NOTIFICATION_URLS:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    cpus: 1.0
    mem_limit: 1g
    networks:
      - default

  loki:
    image: grafana/loki:3.6.7
    container_name: loki
    restart: unless-stopped
    user: root
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/configs/loki/loki.yaml:/etc/loki/loki.yaml
      - loki-data:/tmp/loki/chunks
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default

  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=debug
      - GF_PANELS_ENABLE_ALPHA=false
      - GF_INSTALL_PLUGINS=grafana-polystat-panel
    volumes:
      - ./monitoring/configs/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
      - ./monitoring/configs/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards/grid_trading_bot_dashboard.json:/var/lib/grafana/dashboards/grid_trading_bot_dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default

  alloy:
    image: grafana/alloy:v1.13.2
    container_name: alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./monitoring/configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
    cpus: 0.5
    mem_limit: 512m
    networks:
      - default

volumes:
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alloy-data:
    driver: local
